<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
    <div class="todo_index">
        <section class="login">
            <div class="superior">
                <img src="resources/img/logo_marca.png" alt="logo_marca" />
                <h1 class="saludo">Welcome Back</h1>
            </div>
            <form class="formulario" action="/paginas/select.html" method="POST">
                <div class="campo">

                    <input type="text" id="username" name="username" placeholder="User" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>

                </div>
                <div class="boton-logo">
                    <div>
                        <button type="button" class="boton-acceso" onclick="location.href='/paginas/select.html'">Log
                            In</button>
                    </div>
                    <div class="boton-duo">
                        <button type="button" class="boton-google" onclick="location.href='/paginas/select.html'">
                            <img class="google" src="resources/img/google.png" alt="logo_google">Login
                            With Google
                        </button>
                    </div>
                </div>
            </form>
        </section>
        <section class="foto">
            <img class="foto_inicio" src="resources/img/img_login.png" alt="logo_imagen">

        </section>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
    <section class="login">
        <div class="superior">
            <img src="resources/img/logo_marca.png" alt="logo_marca" />
            <h1 class="saludo">Welcome Back</h1>
        </div>
        <div class="formulario">
            <form action="/submit-login" method="POST">
                <div class="campo">

                    <input type="text" id="username" name="username" placeholder="User" required>
                    <input type="password" id="password" name="password" placeholder="Password" required>

                </div>
                <div class="boton-logo">
                    <div> <button type="submit" class="boton-acceso">Log In</button> </div>
                    <div class="boton-duo"> <button type="submit" class="boton-google"><img class="google"
                                src="resources/img/google.png" alt="logo_google">Login
                            With Google</button> </div>
                </div>
            </form>
        </div>
    </section>
    <section class="foto">
        <img class="foto_grande" src="resources/img/img_login.png" alt="foto_inicio" />

    </section>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<body>

            <div class="user">User_name

        <div class="texto-rebajas">

            <h3>Abrigo acolchado extralargo</h3>
            <p>49,99 €</p>

        <div class="producto">
            <img src="../resources/img/model_woman_04.pngg" alt="Gabardina vaquera">
